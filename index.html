<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microdrama Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #0c0c0e; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #f2f1ef; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { height: 10px; width: 10px; }
  ::-webkit-scrollbar-thumb { background: #2a2a2e; border-radius: 6px; }
  a { color: #ff5a45; }
  a:hover { color: #e11d2a; }
  input, select, button, textarea { font-family: inherit; }
  input:focus, select:focus { outline: 2px solid #e11d2a55; border-color: #e11d2a; }
  .grotesk { font-family: 'Space Grotesk', sans-serif; }
  .tr-row:hover { background: #1a1a1d !important; }
</style>
</head>
<body>
<div id="root"></div>
<script src="./app.js"></script>
</body>
</html>
